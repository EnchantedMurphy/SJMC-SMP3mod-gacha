plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = "gacha-${project.minecraft_version}-fabric" }

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex 'org\\.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    // Optional local integration test input; never bundled into the production mod.
    if (project.hasProperty('fuji_test_jar')) runtimeOnly files(project.property('fuji_test_jar'))
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
test { useJUnitPlatform() }
loom {
    runs {
        server { programArg 'nogui' }
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'gacha-test'
        enableGameTests = true
        eula = true
    }
}
loom {
    runs {
        fujiIntegration {
            inherit server
            source sourceSets.gametest
            runDir 'build/run/fujiIntegration'
            vmArg '-Dgacha.fujiIntegration=true'
        }
    }
}
